{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>MiniCRM</title>
    <link rel="stylesheet" href="{% static 'static/css/main.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="sidebar">
        <ul class="nav-list">
            <li class="nav-item {% if request.path == '/projects/' or request.path == '/' %}active{% endif %}">
                <a href="{% url 'projects' %}">
                    <img src="{% static 'icons/folder.svg' %}" alt="Проекты">
                    <span>Проекты</span>
                </a>
            </li>
            <li class="nav-item {% if request.path == '/clients/' %}active{% endif %}">
                <a href="{% url 'clients' %}">
                    <img src="{% static 'icons/user.svg' %}" alt="Клиенты">
                    <span>Клиенты</span>
                </a>
            </li>
            <li class="nav-item {% if request.path == '/tasks/' %}active{% endif %}">
                <a href="{% url 'tasks' %}">
                    <img src="{% static 'icons/check.svg' %}" alt="Задачи">
                    <span>Задачи</span>
                </a>
            </li>
            <li class="nav-item {% if request.path == '/finance/' %}active{% endif %}">
                <a href="{% url 'finance' %}">
                    <img src="{% static 'icons/chart.svg' %}" alt="Финансы">
                    <span>Финансы</span>
                </a>
            </li>
            <li class="nav-item {% if request.path == '/calculator/' %}active{% endif %}">
                <a href="{% url 'calculator' %}">
                    <img src="{% static 'icons/calculator.svg' %}" alt="Калькулятор">
                    <span>Калькулятор</span>
                </a>
            </li>
        </ul>

        <div class="sidebar-profile">
            <div class="profile-bar">
                <img src="{% static 'icons/avatar.png' %}" alt="Аватар" class="avatar">
                <span class="username" title="Имя пользователя">Максим Е.</span>
                <div class="profile-actions">
                    <img src="{% static 'icons/settings.svg' %}" alt="Настройки" class="icon-btn">
                </div>
            </div>
        </div>
    </nav>

    
    <main class="content">
        {% block content %}
        {% endblock %}
    </main>

    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Настройки интерфейса</h2>
                <span class="close-modal" id="closeSettings">&times;</span>
            </div>
            
            <div class="modal-body" style="padding: 20px 0;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <span style="color: var(--text-primary); font-size: 16px;">Светлая тема</span>
                    <label class="theme-switch">
                        <input type="checkbox" id="themeCheckbox">
                        <span class="theme-slider"></span>
                    </label>
                </div>

                <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 20px 0;">

                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span style="color: var(--text-primary); font-size: 16px;">Аккаунт</span>
                    <button type="button" class="btn-danger" id="logoutRequestBtn" style="padding: 8px 16px; font-size: 14px;">Выйти</button>
                </div>
            </div>
            </div>
    </div>

    <div id="confirmLogoutModal" class="modal confirm-modal" style="display: none;">
        <div class="modal-content confirm-content">
            <div class="confirm-icon">🚪</div>
            <h2>Завершить сеанс?</h2>
            <p style="color: var(--text-secondary); margin-bottom: 20px;">Вы уверены, что хотите выйти из системы?</p>
            <div class="confirm-actions">
                <button id="cancelLogout" class="btn-secondary">Отмена</button>
                <form action="{% url 'logout' %}" method="post" style="display: inline;">
                    {% csrf_token %}
                    <button type="submit" class="btn-danger">Да, выйти</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const settingsModal = document.getElementById('settingsModal');
            const themeCheckbox = document.getElementById('themeCheckbox');
            const settingsIcon = document.querySelector('img[alt="Настройки"]');
            const closeSettingsBtn = document.getElementById('closeSettings');

            const logoutRequestBtn = document.getElementById('logoutRequestBtn');
            const confirmLogoutModal = document.getElementById('confirmLogoutModal');
            const cancelLogoutBtn = document.getElementById('cancelLogout');

            // --- 1. ТЕМА ---
            if (localStorage.getItem('theme') === 'light') {
                document.body.setAttribute('data-theme', 'light');
                if (themeCheckbox) themeCheckbox.checked = true;
            }

            if (themeCheckbox) {
                themeCheckbox.onchange = () => {
                    if (themeCheckbox.checked) {
                        document.body.setAttribute('data-theme', 'light');
                        localStorage.setItem('theme', 'light');
                    } else {
                        document.body.removeAttribute('data-theme');
                        localStorage.setItem('theme', 'dark');
                    }
                };
            }

            // --- 2. УПРАВЛЕНИЕ НАСТРОЙКАМИ ---
            const closeSettings = () => { settingsModal.style.display = 'none'; };

            if (settingsIcon) {
                settingsIcon.onclick = () => { settingsModal.style.display = 'flex'; };
            }

            if (closeSettingsBtn) closeSettingsBtn.onclick = closeSettings;

            // --- 3. ВЫХОД ---
            if (logoutRequestBtn) {
                logoutRequestBtn.onclick = () => {
                    closeSettings();
                    confirmLogoutModal.style.display = 'flex';
                };
            }

            const closeLogoutModal = () => { confirmLogoutModal.style.display = 'none'; };
            if (cancelLogoutBtn) cancelLogoutBtn.onclick = closeLogoutModal;

            // --- 4. КЛИК ВНЕ МОДАЛОК ---
            window.addEventListener('click', (event) => {
                if (event.target === settingsModal) closeSettings();
                if (event.target === confirmLogoutModal) closeLogoutModal();
            });
        });
    </script>
</body>
</html>
