{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>MiniCRM</title>
    <link rel="stylesheet" href="{% static 'static/css/main.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="sidebar">
        <ul class="nav-list">
            <li class="nav-item {% if request.path == '/projects/' or request.path == '/' %}active{% endif %}">
                <a href="{% url 'projects' %}">
                    <img src="{% static 'icons/folder.svg' %}" alt="Проекты">
                    <span>Проекты</span>
                </a>
            </li>
            <li class="nav-item {% if request.path == '/clients/' %}active{% endif %}">
                <a href="{% url 'clients' %}">
                    <img src="{% static 'icons/user.svg' %}" alt="Клиенты">
                    <span>Клиенты</span>
                </a>
            </li>
            <li class="nav-item {% if request.path == '/tasks/' %}active{% endif %}">
                <a href="{% url 'tasks' %}">
                    <img src="{% static 'icons/check.svg' %}" alt="Задачи">
                    <span>Задачи</span>
                </a>
            </li>
            <li class="nav-item {% if request.path == '/finance/' %}active{% endif %}">
                <a href="{% url 'finance' %}">
                    <img src="{% static 'icons/chart.svg' %}" alt="Финансы">
                    <span>Финансы</span>
                </a>
            </li>
            <li class="nav-item {% if request.path == '/calculator/' %}active{% endif %}">
                <a href="{% url 'calculator' %}">
                    <img src="{% static 'icons/calculator.svg' %}" alt="Калькулятор">
                    <span>Калькулятор</span>
                </a>
            </li>
        </ul>
    </nav>
    <main class="content">
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
